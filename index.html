<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Vision Analyzer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0e1621;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #17212b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 10px; font-size: 22px; }
        p { color: #8d96a0; font-size: 14px; margin-bottom: 20px; }
        .upload-btn {
            background: #2481cc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .upload-btn:hover { background: #1b6ca8; }
        input[type="file"] { display: none; }
        #preview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        .loading {
            display: none;
            margin-top: 15px;
            color: #ffaa00;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🐎 Trot تحليل سباقات</h2>
    <p>التقط أو ارفع صورة لجدول السباق (Race Card) لتحليله فوراً واستخراج النسب الرياضية.</p>
    
    <label for="fileInput" class="upload-btn">📸 التقط أو رفع صورة السباق</label>
    <input type="file" id="fileInput" accept="image/*">

    <img id="preview" alt="معاينة الصورة">
    <div id="loadingText" class="loading">⏳ جاري معالجة الصورة وتحليل البيانات...</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand(); // توسيع التطبيق لملء الشاشة

    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const loadingText = document.getElementById('loadingText');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                loadingText.style.display = 'block';

                // محاكاة إرسال البيانات وإغلاق التطبيق ليعود للدردشة بالنتيجة
                setTimeout(() => {
                    loadingText.innerText = "✅ تم استخراج البيانات والتحليل بنجاح!";
                    
                    // إرسال بيانات وهمية أو إغلاق التطبيق ليعود البوت للدردشة
                    setTimeout(() => {
                        tg.sendData(JSON.stringify({ action: "analyze_race", status: "success" }));
                        tg.close();
                    }, 1000);
                }, 2000);
            }
            reader.readAsDataURL(file);
        }
    });
</script>

</body>
</html>
